<!DOCTYPE html>
<html>
<head><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container mt-5 col-md-4">
        <div class="card p-4 shadow">
            <h3>Login</h3>
            {% if error %}<div class="alert alert-danger" data-testid="login-error">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="mb-3"><input type="email" name="email" id="login-email" data-testid="login-email" class="form-control" placeholder="Email" required></div>
                <div class="mb-3"><input type="password" name="password" id="login-password" data-testid="login-password" class="form-control" placeholder="Password" required></div>
                <button type="submit" id="login-submit" data-testid="login-submit" class="btn btn-dark w-100">Login</button>
            </form>
            <div class="mt-3 text-center"><a href="/register">Create Account</a></div>
        </div>
    </div>
</body>
</html>
