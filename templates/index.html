<!DOCTYPE html>
<html>
<head><title>STYLEHUB - Home</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
        <a class="navbar-brand fw-bold" href="/" data-testid="logo">STYLEHUB</a>
        <div class="ms-auto">
            <a href="/cart" class="btn btn-outline-dark me-2" data-testid="cart-icon">Cart</a>
            {% if session.get('user') %}
                <span class="fw-bold me-3" data-testid="user-profile">{{ session.get('user_name') }}</span>
                <a href="/logout" class="btn btn-sm btn-outline-danger" data-testid="logout-btn">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-dark btn-sm" data-testid="login-link">Login</a>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Trending Products</h2>
        <div class="row">
            {% for p in products %}
            <div class="col-md-3">
                <div class="card p-3 shadow-sm" data-testid="product-card">
                    <h5>{{ p.name }}</h5>
                    <p>₹{{ p.final_price }}</p>
                    <a href="/product/{{ p.id }}" class="btn btn-dark btn-sm" data-testid="view-product-{{ p.id }}">View Details</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
