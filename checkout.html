<!DOCTYPE html>
<html>
<head><title>Checkout</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container mt-5 col-md-6">
        <div class="card p-4 shadow">
            {% if success %}
                <h3 class="text-success" data-testid="order-success-msg">Order Placed Successfully!</h3>
                <a href="/" class="btn btn-dark mt-3">Continue Shopping</a>
            {% else %}
                <h3>Checkout</h3>
                <form method="POST">
                    <div class="mb-3"><input type="text" name="address" class="form-control" placeholder="Shipping Address" required></div>
                    <button type="submit" class="btn btn-dark w-100" data-testid="place-order">Place Order</button>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
