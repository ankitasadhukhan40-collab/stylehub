<!DOCTYPE html>
<html>
<head><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container mt-5 col-md-4">
        <div class="card p-4 shadow">
            <h3>Register</h3>
            <form method="POST">
                <div class="mb-3"><input type="text" name="first_name" data-testid="register-firstname" class="form-control" placeholder="First Name" required></div>
                <div class="mb-3"><input type="email" name="email" data-testid="register-email" class="form-control" placeholder="Email" required></div>
                <div class="mb-3"><input type="password" name="password" data-testid="register-password" class="form-control" placeholder="Password" required></div>
                <button type="submit" data-testid="register-submit" class="btn btn-dark w-100">Register</button>
            </form>
            <div class="mt-3 text-center"><a href="/login">Back to Login</a></div>
        </div>
    </div>
</body>
</html>
