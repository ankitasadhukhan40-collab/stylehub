<!DOCTYPE html>
<html>
<head><title>Cart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Shopping Cart</h2>
        <ul class="list-group mb-3">
            {% for item in cart %}
            <li class="list-group-item d-flex justify-content-between">
                <span>{{ item.name }} ({{ item.size }}, {{ item.color }}) x {{ item.quantity }}</span>
                <strong>₹{{ item.price * item.quantity }}</strong>
            </li>
            {% endfor %}
        </ul>
        <h4>Subtotal: ₹{{ subtotal }}</h4>
        <a href="/checkout" class="btn btn-success" data-testid="checkout-button">Proceed to Checkout</a>
    </div>
</body>
</html>
