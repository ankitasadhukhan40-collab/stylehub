<!DOCTYPE html>
<html>
<head><title>Product Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h2>{{ product.name }}</h2>
            <h4 class="text-success">₹{{ product.final_price }}</h4>
            <form method="POST" action="/cart">
                <input type="hidden" name="product_id" value="{{ product.id }}">
                <div class="mb-3">
                    <label>Size:</label>
                    <select name="size" class="form-control" data-testid="product-size">
                        {% for s in product.sizes %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label>Color:</label>
                    <select name="color" class="form-control" data-testid="product-color">
                        {% for c in product.colors %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-dark" data-testid="add-to-cart">Add to Cart</button>
            </form>
        </div>
    </div>
</body>
</html>
